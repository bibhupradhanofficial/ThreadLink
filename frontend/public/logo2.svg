<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <defs>
    <!-- Light Theme Background Gradient -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Subtle Container Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Ambient Light Radial Glow -->
    <radialGradient id="ambientLightGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FEF3C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Metallic Gradient (Light Mode) -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Royal Indigo/Violet Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Thread Ribbon Gradient (Coral to Gold to Indigo) -->
    <linearGradient id="threadRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Page Left Gradient -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Page Right Gradient -->
    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Crisp Soft Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#475569" flood-opacity="0.05" />
    </filter>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#312E81" flood-opacity="0.15" />
    </filter>

    <!-- Subtle Thread Glow -->
    <filter id="threadGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Light Theme Squircle Container -->
  <rect x="20" y="20" width="460" height="460" rx="96" fill="url(#lightBg)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#softShadow)" />

  <!-- Ambient Light Reflection inside Badge -->
  <rect x="22" y="22" width="456" height="456" rx="94" fill="url(#ambientLightGlow)" pointer-events="none" />

  <!-- Subtle Decorative Grid Lines in Background -->
  <g opacity="0.06" stroke="#475569" stroke-width="1">
    <line x1="100" y1="60" x2="100" y2="440" stroke-dasharray="4 8" />
    <line x1="250" y1="60" x2="250" y2="440" stroke-dasharray="4 8" />
    <line x1="400" y1="60" x2="400" y2="440" stroke-dasharray="4 8" />
    <line x1="60" y1="100" x2="440" y2="100" stroke-dasharray="4 8" />
    <line x1="60" y1="250" x2="440" y2="250" stroke-dasharray="4 8" />
    <line x1="60" y1="400" x2="440" y2="400" stroke-dasharray="4 8" />
  </g>

  <!-- Manuscript / Book Page Base Geometry -->
  <g filter="url(#softShadow)">
    <!-- Left Page -->
    <path d="M 120 330 C 170 305, 230 312, 250 326 L 250 174 C 230 160, 170 153, 120 178 Z" fill="url(#pageLeftGrad)" stroke="#C7D2FE" stroke-width="2" />
    
    <!-- Right Page -->
    <path d="M 380 330 C 330 305, 270 312, 250 326 L 250 174 C 270 160, 330 153, 380 178 Z" fill="url(#pageRightGrad)" stroke="#FDE68A" stroke-width="2" />

    <!-- Page Stack Edge Accents -->
    <path d="M 124 336 C 172 312, 230 318, 250 332" stroke="#93C5FD" stroke-width="1.5" fill="none" opacity="0.7" />
    <path d="M 376 336 C 328 312, 270 318, 250 332" stroke="#FCD34D" stroke-width="1.5" fill="none" opacity="0.7" />
  </g>

  <!-- Manuscript Spine Axis -->
  <line x1="250" y1="165" x2="250" y2="335" stroke="url(#indigoGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Dotted Thread Constellation Connection Web -->
  <path d="M 140 200 L 250 250 L 360 200 L 250 300 Z" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />

  <!-- Main Continuity Thread - Smooth Weaving Infinity Knot ("T" & "L" Interlocking Loop) -->
  <g filter="url(#ribbonShadow)">
    <!-- Back Loop Pass -->
    <path d="M 150 250 C 150 195, 215 190, 250 235 C 285 280, 350 275, 350 225 C 350 175, 285 185, 250 235 C 215 285, 150 295, 150 250 Z" 
          fill="none" 
          stroke="url(#threadRibbonGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Front Thread Highlight Accent (Inner Core Shine) -->
    <path d="M 150 250 C 150 195, 215 190, 250 235 C 285 280, 350 275, 350 225 C 350 175, 285 185, 250 235 C 215 285, 150 295, 150 250 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          opacity="0.45" />
  </g>

  <!-- Interactive Memory Nodes (Plot Point Constellations) -->
  <!-- Node 1: Top Left Coral Node -->
  <g transform="translate(150, 250)">
    <circle cx="0" cy="0" r="14" fill="#FFE4E6" />
    <circle cx="0" cy="0" r="9" fill="#F43F5E" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Node 2: Top Right Amber Node -->
  <g transform="translate(350, 225)">
    <circle cx="0" cy="0" r="14" fill="#FEF3C7" />
    <circle cx="0" cy="0" r="9" fill="#F59E0B" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Node 3: Center Core Synthesis Star / Quill Sparkle -->
  <g transform="translate(250, 235)" filter="url(#threadGlow)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" opacity="0.9" />
    <circle cx="0" cy="0" r="12" fill="url(#goldMetallic)" />
    <!-- 4-point Diamond Sparkle -->
    <path d="M 0 -15 L 4 -4 L 15 0 L 4 4 L 0 15 L -4 4 L -15 0 L -4 -4 Z" fill="#FFFFFF" />
  </g>

  <!-- Node 4: Bottom Left Cyan Intelligence Dot -->
  <g transform="translate(190, 282)">
    <circle cx="0" cy="0" r="6" fill="#0EA5E9" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Node 5: Right Quill Tip Ornament -->
  <path d="M 350 225 L 368 210 L 358 238 Z" fill="url(#goldMetallic)" filter="url(#softShadow)" />

  <!-- Corner Minimalist Accent Details (Light Theme Aesthetic) -->
  <g opacity="0.25" stroke="url(#indigoGrad)" stroke-width="2" stroke-linecap="round">
    <path d="M 70 95 L 95 70" />
    <circle cx="70" cy="70" r="4" fill="#6366F1" stroke="none" />
    
    <path d="M 430 95 L 405 70" />
    <circle cx="430" cy="70" r="4" fill="#F59E0B" stroke="none" />

    <path d="M 70 405 L 95 430" />
    <circle cx="70" cy="430" r="4" fill="#F43F5E" stroke="none" />

    <path d="M 430 405 L 405 430" />
    <circle cx="430" cy="430" r="4" fill="#4F46E5" stroke="none" />
  </g>
</svg>
