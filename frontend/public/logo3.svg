<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <defs>
    <!-- Dark Theme Background Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Dark Container Border Gradient -->
    <linearGradient id="darkBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.8" />
    </linearGradient>

    <!-- Deep Ambient Radial Glow (Dark Mode Neon) -->
    <radialGradient id="darkAmbientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Metallic Gradient (Dark Theme High-Contrast) -->
    <linearGradient id="darkGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Indigo/Violet Gradient -->
    <linearGradient id="electricIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Neon Thread Ribbon Gradient (Electric Rose -> Gold -> Cyan -> Indigo) -->
    <linearGradient id="darkThreadRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="25%" stop-color="#FF9500" />
      <stop offset="55%" stop-color="#FFCC00" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00C7BE" />
    </linearGradient>

    <!-- Translucent Dark Left Page -->
    <linearGradient id="darkPageLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.5" />
    </linearGradient>

    <!-- Translucent Dark Right Page -->
    <linearGradient id="darkPageRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.5" />
    </linearGradient>

    <!-- Dark Mode Drop Shadow & Neon Bloom -->
    <filter id="darkSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>

    <filter id="neonRibbonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Sparkle Glow -->
    <filter id="coreStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Theme Squircle Container -->
  <rect x="20" y="20" width="460" height="460" rx="96" fill="url(#darkBg)" stroke="url(#darkBorderGrad)" stroke-width="2.5" filter="url(#darkSoftShadow)" />

  <!-- Inner Ambient Neon Reflection -->
  <rect x="22" y="22" width="456" height="456" rx="94" fill="url(#darkAmbientGlow)" pointer-events="none" />

  <!-- Subtle Cyber Grid Lines in Background -->
  <g opacity="0.12" stroke="#6366F1" stroke-width="1">
    <line x1="100" y1="60" x2="100" y2="440" stroke-dasharray="4 8" />
    <line x1="250" y1="60" x2="250" y2="440" stroke-dasharray="4 8" />
    <line x1="400" y1="60" x2="400" y2="440" stroke-dasharray="4 8" />
    <line x1="60" y1="100" x2="440" y2="100" stroke-dasharray="4 8" />
    <line x1="60" y1="250" x2="440" y2="250" stroke-dasharray="4 8" />
    <line x1="60" y1="400" x2="440" y2="400" stroke-dasharray="4 8" />
  </g>

  <!-- Manuscript / Book Page Geometry (Glassmorphic Dark Mode) -->
  <g filter="url(#darkSoftShadow)">
    <!-- Left Page -->
    <path d="M 120 330 C 170 305, 230 312, 250 326 L 250 174 C 230 160, 170 153, 120 178 Z" fill="url(#darkPageLeftGrad)" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.6" />
    
    <!-- Right Page -->
    <path d="M 380 330 C 330 305, 270 312, 250 326 L 250 174 C 270 160, 330 153, 380 178 Z" fill="url(#darkPageRightGrad)" stroke="#FBBF24" stroke-width="1.8" stroke-opacity="0.6" />

    <!-- Page Stack Edge Neon Accents -->
    <path d="M 124 336 C 172 312, 230 318, 250 332" stroke="#6366F1" stroke-width="1.5" fill="none" opacity="0.8" />
    <path d="M 376 336 C 328 312, 270 318, 250 332" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.8" />
  </g>

  <!-- Manuscript Spine Axis (Glowing Electric Core) -->
  <line x1="250" y1="165" x2="250" y2="335" stroke="url(#darkGoldMetallic)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonRibbonGlow)" />

  <!-- Dotted Thread Constellation Connection Web -->
  <path d="M 140 200 L 250 250 L 360 200 L 250 300 Z" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Main Continuity Thread - Smooth Weaving Infinity Knot ("T" & "L" Interlocking Loop) -->
  <g filter="url(#neonRibbonGlow)">
    <!-- Main Ribbon Stroke -->
    <path d="M 150 250 C 150 195, 215 190, 250 235 C 285 280, 350 275, 350 225 C 350 175, 285 185, 250 235 C 215 285, 150 295, 150 250 Z" 
          fill="none" 
          stroke="url(#darkThreadRibbonGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pure Electric Core Highlight Pass -->
    <path d="M 150 250 C 150 195, 215 190, 250 235 C 285 280, 350 275, 350 225 C 350 175, 285 185, 250 235 C 215 285, 150 295, 150 250 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          opacity="0.7" />
  </g>

  <!-- Luminous Memory Nodes (Dark Theme Neon Stars) -->
  <!-- Node 1: Top Left Electric Rose Node -->
  <g transform="translate(150, 250)" filter="url(#neonRibbonGlow)">
    <circle cx="0" cy="0" r="14" fill="#881337" opacity="0.8" />
    <circle cx="0" cy="0" r="9" fill="#FF2D55" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Node 2: Top Right Glowing Amber Node -->
  <g transform="translate(350, 225)" filter="url(#neonRibbonGlow)">
    <circle cx="0" cy="0" r="14" fill="#78350F" opacity="0.8" />
    <circle cx="0" cy="0" r="9" fill="#FF9500" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Node 3: Center Core Synthesis Star / Diamond Sparkle -->
  <g transform="translate(250, 235)" filter="url(#coreStarGlow)">
    <circle cx="0" cy="0" r="22" fill="#6366F1" opacity="0.35" />
    <circle cx="0" cy="0" r="14" fill="url(#darkGoldMetallic)" />
    <!-- 4-point Diamond Sparkle -->
    <path d="M 0 -16 L 5 -5 L 16 0 L 5 5 L 0 16 L -5 5 L -16 0 L -5 -5 Z" fill="#FFFFFF" />
  </g>

  <!-- Node 4: Bottom Cyan Intelligence Dot -->
  <g transform="translate(190, 282)" filter="url(#neonRibbonGlow)">
    <circle cx="0" cy="0" r="7" fill="#00C7BE" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Node 5: Right Quill Tip Gold Ornament -->
  <path d="M 350 225 L 368 210 L 358 238 Z" fill="url(#darkGoldMetallic)" filter="url(#neonRibbonGlow)" />

  <!-- Corner Minimalist Accent Details (Dark Mode Aesthetic) -->
  <g stroke="url(#darkGoldMetallic)" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <path d="M 70 95 L 95 70" />
    <circle cx="70" cy="70" r="4" fill="#FF2D55" stroke="none" />
    
    <path d="M 430 95 L 405 70" />
    <circle cx="430" cy="70" r="4" fill="#FF9500" stroke="none" />

    <path d="M 70 405 L 95 430" />
    <circle cx="70" cy="430" r="4" fill="#6366F1" stroke="none" />

    <path d="M 430 405 L 405 430" />
    <circle cx="430" cy="430" r="4" fill="#00C7BE" stroke="none" />
  </g>
</svg>
