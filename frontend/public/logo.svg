<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0d11" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Thread Ribbon Gradient -->
    <linearGradient id="threadGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Book Spine Gradient -->
    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <!-- Glowing Thread Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Emblem Shield Ring -->
  <rect x="25" y="25" width="150" height="150" rx="36" fill="url(#bookSpine)" stroke="url(#goldMetallic)" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Manuscript Book Pages Left & Right -->
  <path d="M50 135 C 70 125, 92 128, 100 134 C 108 128, 130 125, 150 135 L 150 65 C 130 55, 108 58, 100 64 C 92 58, 70 55, 50 65 Z" fill="#faf8f5" opacity="0.07" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Inner Page Layer -->
  <path d="M54 130 C 72 122, 92 125, 100 130 C 108 125, 128 122, 146 130 L 146 68 C 128 60, 108 63, 100 68 C 92 63, 72 60, 54 68 Z" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" fill="none" />

  <!-- Center Book Spine Line -->
  <line x1="100" y1="64" x2="100" y2="134" stroke="url(#goldMetallic)" stroke-width="2" stroke-linecap="round" />

  <!-- The Golden Thread Loop (Continuity Memory Wave forming infinity / T-L knot) -->
  <path d="M 60 102 C 60 82, 85 80, 100 96 C 115 112, 140 110, 140 90 C 140 72, 115 78, 100 96 C 85 114, 60 120, 60 102 Z" fill="none" stroke="url(#threadGradient)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Red Contradiction Indicator Pulse Dot -->
  <circle cx="60" cy="102" r="4.5" fill="#ef4444" />
  <circle cx="60" cy="102" r="8" stroke="#ef4444" stroke-width="1" opacity="0.6" />

  <!-- Golden Quill Tip at the Thread End -->
  <path d="M140 90 L146 84 L142 94 Z" fill="url(#goldMetallic)" />

  <!-- Decorative Corner Accents -->
  <path d="M38 48 L48 38 M38 38 L48 48" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M162 48 L152 38 M162 38 L152 48" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
</svg>
